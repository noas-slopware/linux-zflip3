# pacman.conf for building the public image (mkpublic-zflip3.sh): pacman-zflip3.conf with [zflip3]
# from the published repository (GitHub Pages first, then YuruMirror, as zflip3-mirrorlist lists them)
# instead of the local repo dir, so the image gets the published packages and the published
# zflip3.db. mkpublic-zflip3.sh takes the two servers from here and checks that both serve the same
# zflip3.db; the image's own pacman.conf takes [zflip3] from zflip3-mirrorlist.
[options]
HoldPkg     = pacman glibc
Architecture = aarch64
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
# qemu-user implements neither Landlock nor seccomp, which pacman's download sandbox needs
DisableSandbox

[core]
Server = https://arch-linux-repo.drzee.net/arch/$repo/os/$arch

[zflip3]
SigLevel = Never
Server = https://noas-slopware.github.io/linux-zflip3/arch/$arch
Server = https://mirror.funami.tech/linux-zflip3/arch/$arch

[extra]
Server = https://arch-linux-repo.drzee.net/arch/$repo/os/$arch

[forge]
Server = https://arch-linux-repo.drzee.net/arch/$repo/os/$arch
