# pacman.conf for the zflip3 build containers and the image builder: Arch Linux Ports AArch64
# (arch-linux-repo.drzee.net, ARMv8.2) and [zflip3], the port's own packages, between [core] and
# [extra] so its forks of extra packages win. In the containers [zflip3] is the repo directory
# bind-mounted at /repo.
[options]
HoldPkg     = pacman glibc
Architecture = aarch64
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
# qemu-user implements neither Landlock nor seccomp, which pacman's download sandbox needs
DisableSandbox

[core]
Server = https://arch-linux-repo.drzee.net/arch/$repo/os/$arch

[zflip3]
SigLevel = Never
Server = file:///repo

[extra]
Server = https://arch-linux-repo.drzee.net/arch/$repo/os/$arch

[forge]
Server = https://arch-linux-repo.drzee.net/arch/$repo/os/$arch
