# Galaxy Z Flip3 (zflip3-boot). Sourced after /etc/mkinitcpio.conf, so these win.
# No autodetect: images are also built in a chroot on another machine, where it would pick that
# machine's modules. No kms hook: the panels, MDSS and UFS are built into linux-zflip3, and the GPU
# loads its firmware from the root file system. lvm2: / is F2FS on LVM (VG b2q), F2FS is built in.
HOOKS=(base systemd modconf block lvm2 filesystems fsck)
COMPRESSION="zstd"
