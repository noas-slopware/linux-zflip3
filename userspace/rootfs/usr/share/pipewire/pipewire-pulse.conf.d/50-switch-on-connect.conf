# Switch to an audio device when it is connected (a USB DAC or headset, a
# Bluetooth one), as Android does: WirePlumber only ever restores a device
# that was picked by hand before, so a new one never became the default.
#
# The module skips internal cards only when they sit on PCI/ISA; the phone's
# own card is a platform device, so its sinks and sources (Speaker, Earpiece,
# the Voice Call profile's, which callaudiod switches to during calls) are
# blocklisted by name. HDMI stays out as upstream has it.
pulse.cmd = [
    { cmd = "load-module"
      args = "module-switch-on-connect blocklist=hdmi|^alsa_(output|input)\\.platform-"
      flags = [ "nofail" ] }
]
