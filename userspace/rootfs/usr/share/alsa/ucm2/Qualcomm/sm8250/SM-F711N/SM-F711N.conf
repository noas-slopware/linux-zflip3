Syntax 4

# The machine driver pins the TDM backend to S16_LE, 48 kHz, 2 channels, and
# PipeWire opens UCM PCMs without automatic format conversion, so the PCMs
# below carry the conversion. Channel 0 goes to TDM slot 0 (the receiver amp,
# stock "Left"), channel 1 to slot 1 (the bottom speaker amp, stock "Right").
# The VA capture backend is 2 channels: DEC0 (main mic) and DEC1 (sub mic).
LibraryConfig.b2q.SubstiConfig {
	pcm.b2q_speaker {
		type plug
		slave {
			pcm "hw:${CardId},0"
			format S16_LE
			rate 48000
			channels 2
		}
	}

	pcm.b2q_mic {
		type plug
		slave {
			pcm "hw:${CardId},1"
			format S16_LE
			rate 48000
			channels 2
		}
	}
}

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8250/SM-F711N/HiFi.conf"
	Comment "Play HiFi quality music"
}
