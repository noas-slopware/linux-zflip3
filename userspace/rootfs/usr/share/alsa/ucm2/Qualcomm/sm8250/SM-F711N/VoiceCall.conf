SectionVerb {
	EnableSequence [
		cset "name='Speaker DSP1 Preload Switch' 1"
		cset "name='Earpiece DSP1 Preload Switch' 1"
		cset "name='Speaker DSP RX1 Source' ASPRX1"
		cset "name='Speaker DSP RX2 Source' ASPRX1"
		cset "name='Earpiece DSP RX1 Source' ASPRX1"
		cset "name='Earpiece DSP RX2 Source' ASPRX1"
		cset "name='Speaker PCM Source' DSP"
		cset "name='Earpiece PCM Source' DSP"
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 1"
	]

	DisableSequence [
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 0"
	]

	Value {
		TQ "Voice"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Speaker"
	]

	# Stock handset gains on the receiver; the speaker amp is muted.
	EnableSequence [
		cset "name='Speaker Digital PCM Volume' 0"
		cset "name='Earpiece Analog PCM Volume' 2"
		cset "name='Earpiece Digital PCM Volume' 761"
	]

	DisableSequence [
		cset "name='Earpiece Digital PCM Volume' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "b2q_speaker"
		PlaybackChannels 2
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	ConflictingDevice [
		"Earpiece"
	]

	EnableSequence [
		cset "name='Earpiece Analog PCM Volume' 18"
		cset "name='Speaker Analog PCM Volume' 18"
		cset "name='Earpiece Digital PCM Volume' 817"
		cset "name='Speaker Digital PCM Volume' 817"
	]

	DisableSequence [
		cset "name='Earpiece Digital PCM Volume' 0"
		cset "name='Speaker Digital PCM Volume' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "b2q_speaker"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Microphone"

	EnableSequence [
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DEC1 MUX' VA_DMIC"
		cset "name='VA DMIC MUX0' DMIC1"
		cset "name='VA DMIC MUX1' DMIC3"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_AIF1_CAP Mixer DEC1' 1"
		cset "name='VA_DEC0 Volume' 84"
		cset "name='VA_DEC1 Volume' 84"
	]

	DisableSequence [
		cset "name='VA_AIF1_CAP Mixer DEC0' 0"
		cset "name='VA_AIF1_CAP Mixer DEC1' 0"
		cset "name='VA DMIC MUX0' ZERO"
		cset "name='VA DMIC MUX1' ZERO"
	]

	Value {
		CapturePriority 100
		CapturePCM "b2q_mic"
		CaptureChannels 2
	}
}
