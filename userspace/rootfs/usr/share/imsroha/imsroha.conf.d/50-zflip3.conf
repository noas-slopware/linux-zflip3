# SPDX-License-Identifier: MIT
# imsroha on the Galaxy Z Flip3 (SM-F711N), as a drop-in (imsroha 0.2.0-20 and later read
# these before /etc/imsroha/imsroha.conf, where a key set wins). Everything not set here is found
# at run time or comes from imsroha's carrier profiles (by the SIM's PLMN); see
# https://github.com/noas-slopware/imsroha and its data/imsroha.conf.
[device]
# The SM8350 modem: QRTR node 0, the IMS PDN over IPA on its own QMAP mux.
qrtr-node=0
data-netdev=rmnet_ipa0
mux-id=3
# The IMS profile as the modem holds it (lte_ims, APN "ims").
profile=4
# Korean carriers check the TTA-VoLTE User-Agent: the Korean model number, and the carrier that
# first sold the phone (SKT, KT or LGU). Without operator=, imsroha says OMD (open market device);
# set operator= in /etc/imsroha/imsroha.conf to the carrier of the sales code the phone was
# sold with (LUC is LGU, SKC is SKT, KTC is KT).
model=SM-F711N
# RCS: terminal_vendor of the autoconfiguration request.
vendor=SEC
