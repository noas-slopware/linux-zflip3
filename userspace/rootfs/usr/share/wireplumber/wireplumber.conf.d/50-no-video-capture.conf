# The only V4L2 devices on this phone are the qcom-iris video codec nodes
# (/dev/video0 and /dev/video1). The iris firmware is not available, so
# opening them returns EINVAL/ENOENT and the v4l2 monitor's
# create-v4l2-device events (priority 500) never complete. Those pending
# events block the WirePlumber event dispatcher, so every later node-added
# event is never handled and audio streams stay at
# "PortConfig mode none" with zero ports.
#
# There is no camera on this port, so do not start the capture monitors.
wireplumber.profiles = {
  main = {
    hardware.video-capture = disabled
    support.modem-manager = required
  }
}
