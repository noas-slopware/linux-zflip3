# Spacebar's daemon starts once per session, from its XDG autostart entry
# (/etc/xdg/autostart/org.kde.spacebar.daemon.desktop, which Plasma runs as
# this unit). It is restarted if it fails, as the separate
# spacebar-daemon.service did; that unit raced the autostart one at login and
# the loser exited, so a restart of the wrong one left the old daemon running.
[Service]
Restart=on-failure
RestartSec=2
