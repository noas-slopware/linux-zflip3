# networkd here only runs usb0 (the NCM link to a host); NetworkManager,
# imsroha-bearer and tailscaled own the rest. By default networkd deletes
# every route and routing policy rule it did not make whenever it starts or
# reloads: a `networkctl reload` removed imsroha-bearer's "from <IMS address>
# lookup 1042" rule, and every SIP packet failed with "Network is
# unreachable" (calls out and in) until the rule was put back.
[Network]
ManageForeignRoutingPolicyRules=no
ManageForeignRoutes=no
ManageForeignNextHops=no
