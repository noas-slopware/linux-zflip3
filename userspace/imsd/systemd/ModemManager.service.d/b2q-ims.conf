[Unit]
# Voice and messaging are delegated to b2q-imsd. ModemManager decides to export
# them from the ID_MM_B2Q_IMS udev tag, and its b2q backend watches the
# org.b2q.Imsd bus name, so imsd may appear at any time after ModemManager.
#
# No ordering against the IMS units: the bearer cannot bind its mux port until
# ModemManager has configured the data port, so ordering ModemManager after
# imsd (which waits for the bearer) would hold ModemManager back for good.
Wants=b2q-ims-bearer.service
