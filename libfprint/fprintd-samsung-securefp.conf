# fprintd's unit only allows USB, SPI and hidraw devices. The samsung_securefp
# driver talks to the TrustZone TA through /dev/qsee-app and drives the sensor's
# reset and interrupt lines through the GPIO character devices.
[Service]
DeviceAllow=/dev/qsee-app rw
DeviceAllow=char-gpiochip rw

# The driver keeps the TA's calibration in /var/lib/samsung-securefp, as stock's
# HAL keeps calib.dat. Not under /var/lib/fprint: fprintd takes every entry
# there for a user.
StateDirectory=samsung-securefp

# Stay up when idle (upstream 1.94.5 exits 30 s after the last Release). The
# lock screen claims the reader at every lock and after every PAM run; this
# keeps the daemon, and the driver's session, from starting over each time.
ExecStart=
ExecStart=/usr/lib/fprintd --no-timeout

# The sensor rail is a sysfs switch that nothing closes for us: if fprintd
# stops or dies with the session open, switch the sensor off. The driver's next
# cold open starts from off anyway.
ExecStopPost=-/usr/bin/sh -c 'echo disabled > /sys/bus/platform/devices/fingerprint-power/state'
